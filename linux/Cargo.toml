# The GTK app is its own workspace so the root workspace, and the required `ci` check, build
# without the GTK and libadwaita dev packages. `.github/workflows/linux.yml` builds it.
[workspace]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/herder-sh/herder"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
herder-adapters = { path = "../crates/herder-adapters" }
herder-client-core = { path = "../crates/herder-client-core" }
herder-daemon = { path = "../crates/herder-daemon" }
herder-protocol = { path = "../crates/herder-protocol" }
herder-store = { path = "../crates/herder-store" }
serde_json = "1"
similar = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
tokio-util = "0.7"

[package]
name = "herder-gtk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adw.workspace = true
gtk.workspace = true
herder-client-core.workspace = true
herder-protocol.workspace = true
serde_json.workspace = true
similar.workspace = true
tokio.workspace = true

[dev-dependencies]
herder-adapters.workspace = true
herder-daemon.workspace = true
herder-store.workspace = true
tempfile.workspace = true
tokio-util.workspace = true

[lints]
workspace = true
