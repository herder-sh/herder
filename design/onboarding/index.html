<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>herder · setup, devices and passkeys (prototype)</title>
<style>
@font-face{font-family:InterLocal;src:url(../../site/fonts/inter.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:MonoLocal;src:url(../../site/fonts/jetbrains-mono.woff2) format("woff2")}
/* Theme.swift, dark */
:root{
  --canvas:#161618;--pane:#1b1b1e;--card:#222226;--sheet:#26262a;--cis:#2e2e33;--raised:#313136;--stroke:#34343a;
  --text:#f7f7f7;--sec:#d1d1d1;--ter:#939393;--quiet:#6e6e76;
  --accent:#e69f00;--run:#5382ee;--fail:#d55e00;--ok:#009e73;--on:#3ecf8e;--action:#5b8cff;--danger:#ef6b5b;--link:#7fa6f5;
  --pf:#26262b;--ps:#3d3d44;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",InterLocal,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,MonoLocal,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0c0c0e;color:var(--text);font:14px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.92em}
[data-go]{cursor:pointer}

/* ---------- prototype chrome ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(12,12,14,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid #222;padding:10px 14px 0}
.top h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.top h1 small{color:var(--ter);font-weight:450}
.toprow{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;background:#1d1d21;border:1px solid #2c2c32;border-radius:99px;padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:99px;font-size:12.5px;color:var(--ter);cursor:pointer}
.seg button.on{background:var(--raised);color:var(--text)}
.flows{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none}
.flows::-webkit-scrollbar{display:none}
.flows button{flex:none;border:1px solid #2c2c32;background:#18181b;color:var(--sec);border-radius:99px;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.flows button b{color:var(--ter);font-weight:600;margin-right:5px}
.flows button.on{background:var(--text);color:#111;border-color:var(--text)}
.flows button.on b{color:#555}
.intro{max-width:980px;margin:0 auto;padding:14px 16px 0;color:var(--sec);font-size:13.5px}
.intro b{color:var(--text)}
.stepbar{max-width:1400px;margin:0 auto;padding:12px 16px 4px;display:flex;align-items:flex-start;gap:14px}
.stepbar .txt{flex:1;min-width:0}
.stepbar h2{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.stepbar p{margin:4px 0 0;color:var(--ter);font-size:13px;max-width:880px}
.stepbar p b{color:var(--sec);font-weight:600}
.nav{display:flex;gap:6px;align-items:center;flex:none}
.nav button{width:34px;height:34px;border-radius:99px;border:1px solid #2c2c32;background:#1a1a1e;cursor:pointer;display:grid;place-items:center}
.nav button:disabled{opacity:.35;cursor:default}
.nav span{font-size:12px;color:var(--ter);min-width:38px;text-align:center}
.dots{display:flex;gap:5px;justify-content:center;padding:6px 0 0}
.dots i{width:6px;height:6px;border-radius:9px;background:#3a3a40;cursor:pointer}
.dots i.on{background:var(--text);width:16px}
.stage{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:14px 12px 60px;flex-wrap:wrap}
.frame-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.frame-label{font-size:11.5px;color:var(--ter);letter-spacing:.04em;text-transform:uppercase}
.hint-tap{color:var(--ter);font-size:12px;text-align:center;padding-bottom:30px}

/* ---------- iPhone ---------- */
.phone{width:402px;height:874px;border-radius:62px;background:#000;padding:0;position:relative;box-shadow:0 0 0 2px #2a2a2e,0 0 0 9px #0d0d0f,0 0 0 10px #333,0 30px 80px rgba(0,0,0,.6);overflow:hidden;flex:none}
.screen{position:absolute;inset:0;background:var(--canvas);overflow:hidden;display:flex;flex-direction:column}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:50}
.sbar{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 46px;font-weight:600;font-size:16.5px;z-index:40;position:relative}
.sbar .r{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:9px;background:#f2f2f2;z-index:60}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.inav{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 16px;flex:none;position:relative}
.inav .t{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:17px;pointer-events:none}
.glass{height:44px;min-width:44px;border-radius:99px;background:rgba(60,60,66,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 13px;font-size:16px;font-weight:500;position:relative;z-index:2;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.glass.icon{padding:0;width:44px}
.ltitle{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 4px 2px}
.lsub{color:var(--ter);font-size:15px;margin:0 4px 14px}
.grp{margin:0 0 22px}
.grp>h6{margin:0 16px 7px;font-size:13px;font-weight:500;color:var(--ter);text-transform:uppercase;letter-spacing:.02em;display:flex;justify-content:space-between}
.grp>h6 a{text-transform:none;color:var(--action);font-weight:500;letter-spacing:0}
.box{background:var(--card);border-radius:24px;overflow:hidden}
.grp>.foot{margin:7px 16px 0;font-size:13px;color:var(--ter)}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:52px;position:relative}
.row+.row:before{content:"";position:absolute;top:0;right:0;left:58px;border-top:.5px solid var(--stroke)}
.box.noicons .row+.row:before{left:16px}
.row .k{flex:1;min-width:0}
.row .k .tt{font-size:16.5px;line-height:1.25;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row .k .ss{font-size:13.5px;color:var(--ter);line-height:1.3;margin-top:2px}
.row .k .ss .mono{font-size:12px}
.row .tr{color:var(--ter);font-size:15px;display:flex;align-items:center;gap:6px;flex:none}
.row.add{color:var(--action);font-size:16.5px}
.row.add .lead{background:none;color:var(--action)}
.lead{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--raised);color:var(--sec)}
.lead.round{border-radius:99px}
.av{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;flex:none;color:#fff;font-weight:650;font-size:14px}
.av.big{width:76px;height:76px;font-size:32px}
.a0{background:#2f8f83}.a1{background:#6a5acd}.a2{background:#b5653a}.a3{background:#3d7fc1}.a4{background:#a8508f}
.tag{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--raised);color:var(--sec);white-space:nowrap}
.tag.ok{color:var(--on);background:rgba(62,207,142,.12)}
.tag.amb{color:var(--accent);background:rgba(230,159,0,.14)}
.tag.blue{color:var(--action);background:rgba(91,140,255,.14)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:99px;font-size:17px;font-weight:600;border:0;width:100%;cursor:pointer}
.btn.pri{background:var(--action);color:#fff}
.btn.sec{background:var(--raised);color:var(--text)}
.btn.plain{background:none;color:var(--action);font-weight:500;height:44px}
.btn.small{height:34px;font-size:14.5px;width:auto;padding:0 14px}
.btn.danger{background:rgba(239,107,91,.14);color:var(--danger)}
.dock{position:absolute;left:0;right:0;bottom:0;padding:14px 20px 34px;background:linear-gradient(to top,var(--canvas) 72%,rgba(22,22,24,0));z-index:30;display:flex;flex-direction:column;gap:6px}
.dock .fine{font-size:12.5px;color:var(--ter);text-align:center;padding:0 10px 4px}
.prog{display:flex;gap:6px;padding:0 4px;margin:4px 0 22px}
.prog i{flex:1;height:4px;border-radius:9px;background:var(--raised)}
.prog i.on{background:var(--text)}
.prog-l{display:flex;justify-content:space-between;font-size:12px;color:var(--ter);margin:-16px 4px 22px}
.prog-l span.on{color:var(--text)}
.hero{text-align:center;padding:10px 6px 0}
.hero h2{font-size:28px;letter-spacing:-.02em;margin:14px 0 8px;line-height:1.15}
.hero p{color:var(--ter);font-size:16px;margin:0 8px 0}
.choice{background:var(--card);border-radius:24px;padding:18px;display:flex;gap:14px;align-items:center;margin-bottom:12px;border:1px solid transparent}
.choice .ci{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--raised);flex:none}
.choice .k{flex:1}
.choice .k b{display:block;font-size:17px;font-weight:600}
.choice .k span{color:var(--ter);font-size:14px}
.choice.hl{border-color:rgba(91,140,255,.55)}
.field{background:var(--card);border-radius:16px;padding:14px 16px;font-size:17px;display:flex;align-items:center;gap:8px}
.field .caret{width:2px;height:22px;background:var(--action);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fl{font-size:13px;color:var(--ter);margin:0 6px 7px}
.cmd{background:#0f0f11;border:1px solid var(--stroke);border-radius:14px;padding:12px 12px 12px 14px;font:13px/1.5 var(--mono);color:#e8e8ec;display:flex;gap:10px;align-items:flex-start}
.cmd code{flex:1;white-space:pre-wrap;word-break:break-all}
.cmd .cp{flex:none;color:var(--ter);padding:2px}
.note{display:flex;gap:10px;font-size:14px;color:var(--ter);padding:4px 6px;line-height:1.4}
.note b{color:var(--sec);font-weight:600}
.note svg{flex:none;margin-top:1px}
.card{background:var(--card);border-radius:24px;padding:16px}
.pk{display:flex;gap:12px;align-items:center}
.pk .key{width:40px;height:40px;border-radius:12px;background:rgba(91,140,255,.14);color:var(--action);display:grid;place-items:center;flex:none}
.pk .k b{font-size:16px;font-weight:600;display:block}
.pk .k span{font-size:13.5px;color:var(--ter)}
.attn{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.attn .ic{width:30px;height:30px;border-radius:99px;display:grid;place-items:center;flex:none;background:rgba(230,159,0,.15);color:var(--accent)}
.attn .ic.err{background:rgba(213,94,0,.16);color:var(--fail)}
.attn .ic.info{background:rgba(91,140,255,.15);color:var(--action)}
.attn .k{flex:1;min-width:0}
.attn .k b{font-size:15.5px;font-weight:600;display:block;line-height:1.3}
.attn .k>span{font-size:13.5px;color:var(--ter);display:block;margin-top:2px;line-height:1.35}
.act{display:flex;gap:8px;flex-wrap:wrap}
.attn .act{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;border-radius:99px;padding:0 14px;font-size:14.5px;font-weight:600;background:var(--raised);color:var(--text);white-space:nowrap}
.chip.pri{background:var(--action);color:#fff}
.chip.q{background:none;color:var(--ter);font-weight:500;padding:0 6px}
.allclear{text-align:center;padding:28px 10px 30px}
.allclear .ok{width:54px;height:54px;border-radius:99px;margin:0 auto 10px;background:rgba(62,207,142,.13);color:var(--on);display:grid;place-items:center}
.allclear b{font-size:17px;display:block}
.allclear span{color:var(--ter);font-size:14px}
.st{width:22px;height:22px;display:grid;place-items:center;flex:none}
.spin{width:18px;height:18px;border-radius:99px;border:2.2px solid rgba(83,130,238,.25);border-top-color:var(--run);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabbar{position:absolute;left:16px;right:16px;bottom:24px;height:62px;border-radius:99px;background:rgba(40,40,44,.72);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-around;padding:0 6px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--sec);padding:6px 14px;border-radius:99px;position:relative}
.tabbar div.on{background:rgba(255,255,255,.1);color:var(--text)}
.tabbar .badge{position:absolute;top:2px;right:8px;background:var(--accent);color:#000;font-size:10.5px;font-weight:700;border-radius:99px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:70}
.isheet{position:absolute;left:8px;right:8px;bottom:8px;top:62px;background:var(--sheet);border-radius:40px;z-index:80;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.isheet.med{top:auto;height:auto}
.isheet .grab{width:38px;height:5px;border-radius:9px;background:#56565c;margin:7px auto 0;flex:none}
.isheet .inav{height:56px}
.isheet .box{background:var(--cis)}
.isheet .card,.isheet .attn,.isheet .field,.isheet .choice{background:var(--cis)}
.isheet .lead{background:#3a3a40}
.isheet .scroll{padding-bottom:30px}
.isheet .dock{position:relative;background:none;padding:10px 20px 26px}
.sysalert{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(44,44,48,.97);border-radius:40px;z-index:90;padding:22px 22px 28px;box-shadow:0 -10px 50px rgba(0,0,0,.6)}
.sysalert .hd{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ter);margin-bottom:16px}
.sysalert .hd .x{margin-left:auto;width:30px;height:30px;border-radius:99px;background:#48484e;display:grid;place-items:center}
.sysalert h4{font-size:21px;margin:0 0 6px;text-align:center;letter-spacing:-.01em}
.sysalert p{text-align:center;color:var(--ter);font-size:14.5px;margin:0 0 18px}
.sysalert .who{display:flex;gap:12px;align-items:center;background:#3a3a40;border-radius:16px;padding:12px 14px;margin-bottom:16px}
.sysalert .btn.pri{background:#0a84ff}
.faceid{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:156px;height:156px;border-radius:36px;background:rgba(48,48,52,.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);z-index:95;display:grid;place-items:center;color:#f2f2f2}
.cam{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#2a2c30,#08090a 75%);z-index:1}
.cam .term{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-3deg) perspective(600px) rotateX(8deg);width:320px;background:#101113;border-radius:10px;padding:14px;font:10px/1.45 var(--mono);color:#cfd2d6;box-shadow:0 20px 60px #000;filter:blur(.3px)}
.cam .reticle{position:absolute;left:50%;top:40%;width:236px;height:236px;transform:translate(-50%,-50%);z-index:3}
.cam .reticle i{position:absolute;width:44px;height:44px;border:4px solid #fff;border-radius:6px}
.cam .reticle i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.cam .reticle i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
.cam .reticle i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 18px}
.cam .reticle i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 18px 0}
.cam .found{position:absolute;left:24px;right:24px;bottom:150px;z-index:4;background:rgba(40,40,44,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.qrbox{background:#fff;border-radius:22px;padding:14px;display:inline-block;line-height:0}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt22{margin-top:22px}.mb12{margin-bottom:12px}
.big-ok{width:84px;height:84px;border-radius:99px;margin:6px auto 0;background:rgba(62,207,142,.13);color:var(--on);display:grid;place-items:center}
.logo{width:86px;height:86px;border-radius:22px;margin:0 auto;background:linear-gradient(160deg,#2c2c32,#141416);border:1px solid #3a3a42;display:grid;place-items:center;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.seg2{display:flex;background:var(--raised);border-radius:99px;padding:3px}
.seg2 div{flex:1;text-align:center;padding:7px 0;border-radius:99px;font-size:14.5px;font-weight:600;color:var(--sec)}
.seg2 div.on{background:#5a5a62;color:#fff}
.sw{width:51px;height:31px;border-radius:99px;background:var(--on);position:relative;flex:none}
.sw:after{content:"";position:absolute;right:2px;top:2px;width:27px;height:27px;border-radius:99px;background:#fff}
.sw.off{background:#39393f}.sw.off:after{right:auto;left:2px}
.check{width:24px;height:24px;border-radius:99px;background:var(--action);display:grid;place-items:center;color:#fff;flex:none}
.check.off{background:none;border:1.5px solid #55555c}

/* ---------- Mac ---------- */
.mac{width:1280px;height:800px;border-radius:14px;background:var(--canvas);box-shadow:0 0 0 1px #3a3a40,0 30px 90px rgba(0,0,0,.65);overflow:hidden;position:relative;display:flex;flex:none;font-size:13px}
.mside{width:228px;flex:none;background:rgba(30,30,34,.92);border-right:1px solid #2a2a2f;padding:0 10px;display:flex;flex-direction:column}
.lights{display:flex;gap:8px;height:52px;align-items:center;padding-left:8px}
.lights i{width:12px;height:12px;border-radius:99px;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.mside .sr{display:flex;align-items:center;gap:9px;height:30px;padding:0 9px;border-radius:8px;color:var(--sec);font-size:13px;position:relative}
.mside .sr svg{color:var(--ter)}
.mside .sr.on{background:var(--raised);color:var(--text)}
.mside .sr.on svg{color:var(--text)}
.mside .sr .n{margin-left:auto;font-size:11.5px;font-weight:650;color:var(--accent)}
.mside .sr .n.b{color:var(--run)}
.mside h6{font-size:11px;color:var(--quiet);margin:16px 9px 4px;font-weight:600;letter-spacing:.02em}
.mside .foot{margin-top:auto;padding:12px 9px 14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ter);border-top:1px solid #2a2a2f}
.mside .foot i{width:7px;height:7px;border-radius:9px;background:var(--ok)}
.mside .foot i.off{background:var(--fail)}
.mmain{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.mhead{height:52px;display:flex;align-items:center;gap:12px;padding:0 24px;flex:none}
.mhead .t{font-size:20px;font-weight:700;letter-spacing:-.01em}
.mhead .s{color:var(--ter);font-size:13px}
.mhead .sp{flex:1}
.pbtn{height:32px;border-radius:9px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;background:none;border:1px solid transparent;color:var(--sec);white-space:nowrap}
.pbtn.pri{background:var(--pf);border-color:var(--ps);color:var(--text)}
.pbtn.blue{background:var(--action);color:#fff}
.pbtn.raised{background:var(--raised);color:var(--text)}
.pbtn.danger{color:var(--danger);background:rgba(239,107,91,.1)}
.mbody{flex:1;overflow:auto;padding:6px 24px 40px}
.mcol{max-width:880px}
.mh{font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ter);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.mh .c{color:var(--quiet)}
.mh a{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:550;color:var(--action);font-size:12.5px}
.mlist{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid #2a2a2f}

const ic = (n, s=18, w=1.9) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const go = t => t ? ` data-go="${t}"` : '';

/* deterministic fake QR */
function qr(seed, px=180){
  const n=25; let s=0; for (const ch of seed) s=(s*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>(s=(s*1103515245+12345)>>>0, (s>>>16)&1);
  const c=px/n; let r='';
  const fin=(x,y)=>{ r+=`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#000"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#000"/>`; };
  for (let y=0;y<n;y++) for (let x=0;x<n;x++){
    const inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9); if(inF) continue;
    if (rnd()) r+=`<rect x="${x*c}" y="${y*c}" width="${c+.3}" height="${c+.3}" fill="#000"/>`;
  }
  fin(0,0); fin(n-7,0); fin(0,n-7);
  return `<svg width="${px}" height="${px}" viewBox="0 0 ${px} ${px}" shape-rendering="crispEdges">${r}</svg>`;
}

<svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.2c2.4 0 4.6.9 6.2 2.4l1.3-1.4A10.9 10.9 0 008 .3 10.9 10.9 0 00.5 3.2l1.3 1.4A9 9 0 018 2.2zm0 3.7c1.4 0 2.7.5 3.6 1.4l1.3-1.4A7.1 7.1 0 008 4a7.1 7.1 0 00-4.9 1.9l1.3 1.4c1-.9 2.2-1.4 3.6-1.4zm0 3.6c.5 0 1 .2 1.3.5L8 11.4 6.7 10c.3-.3.8-.5 1.3-.5z"/></svg>
<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2" fill="#fff"/><rect x="25" y="4.5" width="1.6" height="4" rx=".8" fill="#fff" opacity=".4"/></svg></span></div>`;

function mside(on, badge){
  const sr = (t,i,n='',nb=false) => `<div class="sr ${t===on?'on':''}"${t==='Setup'?go('6:0'):''}>${ic(i,16)}${t}${n?`<span class="n ${nb?'b':''}">${n}</span>`:''}</div>`;
  return `<div class="mside"><div class="lights"><i></i><i></i><i></i></div>
  ${sr('Board','board','2')}${sr('Chats','chat','3',true)}${sr('Bots','bot')}

 { t:'3 of 3 · Approve: one passkey, one Face ID',
   n:'This is where today’s confusion ends: the screen says <b>which passkey</b> it will use and <b>where it is stored</b>. For a new person it creates “Tomas”, for a returning one it names the existing passkey. The code match is there, but small.',

     `<div style="background:var(--card);border-radius:12px">${mrow({lead:lead('server'), t:'trash-can-01', s:'Linux server · <span class="mono">192.168.1.20</span>', tr:`<span style="color:var(--ter)">Terminal shows</span> <b class="mono" style="color:var(--text);letter-spacing:.06em">ROSE 7342</b>`})}</div>` +
     `<div class="fl mt16">You’ll sign in as</div><div class="card pk" style="background:var(--card);border-radius:12px"><div class="key">${ic('key',20,2)}</div><div class="k"><b>Tomas</b><span>New passkey · saved in Apple Passwords</span></div></div>` +
     `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:22px">${pbtn('Back','1:3','raised')}<span style="display:flex;gap:10px;align-items:center"><span style="color:var(--ter);font-size:12px">Touch ID once</span>${pbtn('Create Passkey and Approve','next','blue','finger')}</span></div>`) },
 { t:'3 of 3 · The system saves the passkey',
   n:'The only system prompt in the whole setup. It shows the name chosen in step 1, so the entry in Passwords is recognisable later.',

 { t:'Done: one clear next step',
   n:'Success says what happened in plain words, then offers <b>one</b> primary next step. Adding more machines and devices is listed, not pushed. The same screen closes Add a machine.',
   phone:()=> scroll(`<div style="height:20px"></div>` + prog(3,NEWSTEPS).replace('<div class="prog-l">','<div class="prog-l" style="visibility:hidden">') + `<div class="big-ok">${ic('check',44,2.6)}</div><div class="hero" style="padding-bottom:18px"><h2>trash-can-01 is yours</h2><p>Your passkey “Tomas” is in Apple Passwords.</p></div>` +
     grp('When you’re ready', row({lead:lead('server'), t:'Add another machine', s:'Same three steps', chev:true, to:'3:1'}) + row({lead:lead('laptop'), t:'Use herder on your Mac', s:'Scan a code from this iPhone', chev:true, to:'2:1'}) + row({lead:lead('people'), t:'Invite a teammate', chev:true, to:'5:1'}))) +

     `<div class="mlist">${mrow({lead:lead('server'), t:'Add another machine', s:'Same three steps', tr:ic('chev',13,2.2), to:'3:1'})}${mrow({lead:lead('phone'), t:'Use herder on your iPhone', s:'Scan a code from this Mac', tr:ic('chev',13,2.2), to:'2:1'})}${mrow({lead:lead('people'), t:'Invite a teammate', tr:ic('chev',13,2.2), to:'5:1'})}</div>` +

/* ---------- 2 add a device ---------- */
{ name:'Add a device', steps:[
 { t:'The new device says exactly where to look',
   n:'The receiving iPhone (right path from Welcome) names the button on the other device. On the Mac, <b>Add a device</b> is a header action on Setup, not hidden at the foot of Fleet or under People › You.',
   phone:()=> inav(back('','1:0')) + scroll(prog(0,JOINSTEPS) + oh('Scan a code from your other device','On your Mac, open herder and choose <b style="color:var(--text)">Setup › Add a device</b>.') +
     `<div class="card" style="padding:14px;display:flex;gap:12px;align-items:center"><div style="width:120px;height:78px;border-radius:8px;background:#0e0e10;border:1px solid #3a3a40;position:relative;flex:none"><div style="position:absolute;left:6px;top:8px;width:26px;bottom:8px;border-radius:3px;background:#26262a"></div><div style="position:absolute;right:8px;top:8px;height:13px;width:54px;border-radius:4px;background:var(--action)" class="pulse"></div><div style="position:absolute;left:40px;right:8px;top:30px;height:4px;border-radius:2px;background:#333"></div><div style="position:absolute;left:40px;right:20px;top:40px;height:4px;border-radius:2px;background:#333"></div></div><div style="font-size:14px;color:var(--ter)">On iPhone it’s the ${ic('qr',14)} button in Setup.</div></div>` +
     `<div class="mt16">${note('The code lists your machines. Your passkey stays in Passwords and signs you in here.','key')}</div>`) +
     dock(btn('Scan the Code','next','pri','camera'), btn('I have no other device','4:4','plain')),
   mac:()=> setupMac({ringAdd:true}) },
 { t:'One code that names your machines',
   n:'The giving device shows a big code and, under it, <b>what it shares by name</b>. It says plainly that the code grants nothing; the passkey does. The link carries the person and passkey id, so the receiver can ask for exactly that passkey.',
   phone:()=> camera('Scan the code', 'Tomas’s machines', '5 machines · from MacBook Pro', 'next', macScreenFor()),
   mac:()=> setupMac({over: msheet({t:'Add a device', s:'Scan this with your iPhone’s camera, or in herder › I already use herder.',
     body:`<div class="center" style="padding:6px 0 16px"><div class="qrbox">${qr('fleet-tomas',220)}</div></div>` +
       `<div class="mh" style="margin-top:0">Shares your 5 machines</div><div style="display:flex;flex-wrap:wrap;gap:6px">${M.map(m=>`<span class="tag" style="font-size:12px;padding:4px 10px">${m.n}</span>`).join('')}</div>` +
       `<div class="mt16">${note('The code holds names and addresses, not keys. The new device signs in with your passkey <b>Tomas</b>.','shield')}</div>`,
     foot: pbtn('Copy Link','', 'raised','copy') + pbtn('Done','6:1','blue'), hint:'Works for 10 minutes'})}) },
 { t:'Check before signing in: names, reachability, the passkey',
   n:'Rows are machine <b>names</b>; addresses are secondary. Reachability is checked <b>before</b> Face ID, so “Tailscale is off” shows with its fix instead of a late “Can’t reach it”. The passkey card says which passkey will be used.',
   phone:()=> inav(back('')) + scroll(prog(1,JOINSTEPS) + oh('Sign in to your 5 machines') +
     `<div class="fl">As</div>` + pkcard('Tomas','Your passkey in Apple Passwords') +
     `<div class="mt16"></div>` + grp('', M.map(m=> m.n==='mini-k8s'
       ? row({lead:st('amb'), t:m.n, s:`Can’t reach it: Tailscale is off on this iPhone<div class="act" style="margin-top:8px">${chip('Open Tailscale','','pri','net')}</div>`})
       : row({lead:st('dot'), t:m.n, s:`Ready · ${m.via}`})).join(''), '', 'noicons')) +
     dock(btn('Sign In with Face ID','next','pri','face'), fine('One Face ID for every machine it can reach. mini-k8s can wait.')),
   mac:()=> setupMac({over: msheet({t:'Add a device', s:'Your iPhone scanned the code.',
     body:`<div class="card" style="display:flex;gap:12px;align-items:center;margin-bottom:14px">${lead('phone')}<div style="flex:1"><b>iPhone 17 Pro</b><div style="color:var(--ter);font-size:12px">Waiting for you to approve on the iPhone…</div></div><span class="spin"></span></div>` +
       `<div class="mlist">${M.map(m=>mrow({lead:st(m.n==='mini-k8s'?'amb':'wait'), t:m.n, s:m.n==='mini-k8s'?'The iPhone can’t reach it: Tailscale is off there':'Waiting'})).join('')}</div>`,
     foot: pbtn('Done','6:1','raised'), hint:'You can close this; the iPhone finishes on its own.'})}) },
 { t:'One system prompt, with the right passkey',
   n:'The fleet link carries the passkey’s credential id, so iOS offers <b>only</b> “Tomas”, not a picker of stale entries. One assertion covers every reachable machine (see README: needs a protocol change). User verification is required, so 1Password can’t silently skip Face ID.',
   phone:()=> inav(back('')) + scroll(prog(1,JOINSTEPS) + oh('Sign in to your 5 machines')) +
     `<div class="dim"></div><div class="sysalert"><div class="hd">${ic('key',18)} Passwords<span class="x">${ic('x',13,2.6)}</span></div><h4>Sign in to herder.sh?</h4><p>Use your saved passkey.</p><div class="who"><div class="key" style="width:36px;height:36px;border-radius:10px;background:rgba(91,140,255,.18);color:var(--action);display:grid;place-items:center">${ic('key',18,2)}</div><div><b>Tomas</b><div style="color:var(--ter);font-size:13px">herder.sh · Passwords</div></div></div>${btn('Continue','next')}</div>`,
   mac:()=> setupMac({over: msheet({t:'Add a device', s:'Your iPhone scanned the code.',
     body:`<div class="card" style="display:flex;gap:12px;align-items:center;margin-bottom:14px">${lead('phone')}<div style="flex:1"><b>iPhone 17 Pro</b><div style="color:var(--ter);font-size:12px">Signing in as Tomas…</div></div><span class="spin"></span></div>` +
       `<div class="mlist">${M.map(m=>mrow({lead:st(m.n==='mini-k8s'?'amb':'spin'), t:m.n, s:m.n==='mini-k8s'?'The iPhone can’t reach it: Tailscale is off there':'Signing in…'})).join('')}</div>`,
     foot: pbtn('Done','6:1','raised'), hint:'You can close this; the iPhone finishes on its own.'})}) },
 { t:'Results: every problem names its cause and its fix',
   n:'No “doesn’t know this passkey” dead end. herder says what it actually knows: the machine knows <b>you</b> by another passkey (fix: use it once, and this one is added), it can’t be reached (fix: Tailscale), or it doesn’t know you at all (fix: ask its owner, by name). What’s left moves to Setup › Needs you.',
   phone:()=> inav(back('')) + scroll(prog(1,JOINSTEPS) + oh('Signed in to 3 of 5','Two need you. Fix them now or later from Setup.') +
     grp('', [M[0],M[1],M[2]].map(m=>row({lead:st('ok'), t:m.n, s:'Signed in'})).join('') +
       row({lead:st('amb'), t:'studio', s:`Knows you by another passkey: Tomas in 1Password<div class="act" style="margin-top:8px">${chip('Use 1Password Passkey','next','pri','key')}</div>`}) +
       row({lead:st('amb'), t:'mini-k8s', s:`Can’t reach it: Tailscale is off on this iPhone<div class="act" style="margin-top:8px">${chip('Open Tailscale','next','pri','net')}${chip('Try Again','next')}</div>`}), '', 'noicons')) +
     dock(btn('Done for Now','6:0','sec'), fine('What’s left waits in Setup › Needs you.')),
   mac:()=> setupMac({over: msheet({t:'Add a device', s:'iPhone 17 Pro is on 3 of your 5 machines.',
     body:`<div class="mlist">${[M[0],M[1],M[2]].map(m=>mrow({lead:st('ok'), t:m.n, s:'Signed in'})).join('')}${mrow({lead:st('amb'), t:'studio', s:'Knows Tomas by the 1Password passkey. The iPhone is offering it.'})}${mrow({lead:st('amb'), t:'mini-k8s', s:'The iPhone can’t reach it: Tailscale is off there.'})}</div>`,
     foot: pbtn('Done','6:0','blue'), hint:'Nothing to do on this Mac.'})}) },
 { t:'Done: on every machine',
   n:'The end state is one sentence. Back on the Mac, Setup confirms with a toast and the device appears under You › Devices with “5 of 5 machines”.',
   phone:()=> scroll(`<div style="height:20px"></div>` + prog(2,JOINSTEPS) + `<div class="big-ok">${ic('check',44,2.6)}</div><div class="hero" style="padding-bottom:18px"><h2>This iPhone is on all 5 machines</h2><p>Signed in as Tomas.</p></div>` +
     grp('', M.map(m=>row({lead:st('ok'), t:m.n, s:m.k.replace(' · this Mac','')})).join(''),'','noicons')) + dock(btn('Open herder','6:1')),
   mac:()=> setupMac({over: toast('iPhone 17 Pro is on all 5 machines')}) },
]},

/* ===== app ===== */
const state = { f:0, s:0, d: innerWidth < 760 ? 'phone' : 'both' };
function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('f')) state.f = Math.max(0, Math.min(FLOWS.length-1, +h.get('f')-1));
  if (h.has('s')) state.s = Math.max(0, Math.min(FLOWS[state.f].steps.length-1, +h.get('s')-1));
  if (h.has('d')) state.d = h.get('d');
}
function writeHash(){ history.replaceState(null,'',`#f=${state.f+1}&s=${state.s+1}&d=${state.d}`); }
function fit(el, w){
  const avail = Math.min(document.documentElement.clientWidth - 24, 1400);
  let z = 1;
  if (state.d === 'both' && avail >= 402*0.7 + 1280*0.5 + 28) {
    const total = 402 + 1280 + 28; z = Math.min(1, avail / total);
  } else z = Math.min(1, avail / w);
  el.style.zoom = z;
}
function render(){
  const flow = FLOWS[state.f], step = flow.steps[state.s];
  document.getElementById('flows').innerHTML = FLOWS.map((f,i)=>`<button class="${i===state.f?'on':''}" data-f="${i}"><b>${i+1}</b>${f.name}</button>`).join('');
  document.querySelectorAll('#dev button').forEach(b=>b.classList.toggle('on', b.dataset.d===state.d));
  document.getElementById('st-title').textContent = `${state.f+1}.${state.s+1} · ${step.t}`;
  document.getElementById('st-note').innerHTML = step.n;
  document.getElementById('pos').textContent = `${state.s+1} / ${flow.steps.length}`;
  document.getElementById('prev').disabled = state.f===0 && state.s===0;
  document.getElementById('next').disabled = state.f===FLOWS.length-1 && state.s===flow.steps.length-1;
  document.getElementById('dots').innerHTML = flow.steps.map((_,i)=>`<i class="${i===state.s?'on':''}" data-s="${i}"></i>`).join('');
  const stage = document.getElementById('stage');
  const parts = [];
  if (state.d !== 'mac') parts.push(`<div class="frame-wrap" data-w="402"><div class="frame-label">iPhone</div>${phone(step.phone())}</div>`);
  if (state.d !== 'phone') parts.push(`<div class="frame-wrap" data-w="1280"><div class="frame-label">Mac</div>${step.mac()}</div>`);
  stage.innerHTML = parts.join('');
  stage.querySelectorAll('.frame-wrap').forEach(w=>fit(w, +w.dataset.w));
  writeHash();
}
function move(d){
  let {f,s} = state; s += d;
  if (s < 0) { if (f===0) return; f--; s = FLOWS[f].steps.length-1; }
  if (s >= FLOWS[f].steps.length) { if (f===FLOWS.length-1) return; f++; s = 0; }
  state.f=f; state.s=s; render(); scrollTo({top:0});
}
document.addEventListener('click', e=>{
  const fb = e.target.closest('[data-f]'); if (fb) { state.f=+fb.dataset.f; state.s=0; render(); return; }
  const sb = e.target.closest('#dots [data-s]'); if (sb) { state.s=+sb.dataset.s; render(); return; }
  const db = e.target.closest('#dev [data-d]'); if (db) { state.d=db.dataset.d; render(); return; }
  if (e.target.closest('#prev')) return move(-1);
  if (e.target.closest('#next')) return move(1);
  const g = e.target.closest('[data-go]'); if (!g) return;
  const t = g.dataset.go; if (!t) return;
  if (t==='next') return move(1);
  const [f,s] = t.split(':').map(Number); state.f=f-1; state.s=s; render(); scrollTo({top:0});
});
document.addEventListener('keydown', e=>{ if (e.key==='ArrowRight') move(1); if (e.key==='ArrowLeft') move(-1); });
addEventListener('resize', render);
addEventListener('hashchange', ()=>{ readHash(); render(); });
readHash(); render();
</script>
