[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.17.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/herder-sh/herder"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
async-trait = "0.1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
frankenstein = { version = "0.52", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
herder-adapters = { path = "crates/herder-adapters" }
herder-client-core = { path = "crates/herder-client-core" }
herder-daemon = { path = "crates/herder-daemon" }
herder-protocol = { path = "crates/herder-protocol" }
herder-store = { path = "crates/herder-store" }
herder-tasktools = { path = "crates/herder-tasktools" }
herder-tui = { path = "crates/herder-tui" }
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
insta = "1"
jiff = { version = "0.2", features = ["serde"] }
jsonschema = { version = "0.60", default-features = false }
nix = { version = "0.31", features = ["fs", "hostname", "net", "poll", "signal"] }
nucleo-matcher = "0.3"
portable-pty = "0.9"
prettyplease = "0.3"
proptest = "1"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
ratatui-textarea = "0.9"
qrcode = { version = "0.14", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
regex = "1"
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint", "jiff"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
schemars = { version = "1.2", features = ["jiff02"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_cbor_2 = "0.13"
serde_json = "1"
sha2 = "0.11"
similar = "3"
slack-morphism = { version = "2.31", features = ["hyper"] }
syn = { version = "3", features = ["full"] }
tar = "0.4"
tempfile = "3"
textwrap = "0.16"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-util = "0.7"
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = "3"
ureq = "3"
uniffi = "0.32"
url = "2"
uuid = { version = "1", features = ["v7"] }
# 0.6 verifies with RustCrypto; 0.5 needs OpenSSL, which no herder build links. The daemon
# keeps passkeys as WebAuthn's portable credential id and COSE key, and rebuilds webauthn-rs's
# credential from them to verify: that needs its credential internals, the CBOR codec its COSE
# parser takes, and the proto crate's policy types, all at the versions webauthn-rs uses.
webauthn-rs = { version = "0.6.1-dev", features = ["conditional-ui", "danger-credential-internals"] }
webauthn-rs-proto = "=0.6.1-dev"

# Line tables keep backtraces readable; full debug info would double each worktree's
# `target/`. Dependencies are rarely stepped into, so they get none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
