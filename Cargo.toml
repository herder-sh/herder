[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/herder-sh/herder"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
herder-adapters = { path = "crates/herder-adapters" }
herder-client-core = { path = "crates/herder-client-core" }
herder-daemon = { path = "crates/herder-daemon" }
herder-protocol = { path = "crates/herder-protocol" }
herder-store = { path = "crates/herder-store" }
herder-tui = { path = "crates/herder-tui" }
jiff = { version = "0.2", features = ["serde"] }
jsonschema = { version = "0.58", default-features = false }
nix = { version = "0.31", features = ["signal"] }
proptest = "1"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint", "jiff"] }
schemars = { version = "1.2", features = ["jiff02"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "macros"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = "1"
ureq = "3"
uuid = { version = "1", features = ["v7"] }
