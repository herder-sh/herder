test-authenticator = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
flate2.workspace = true
frankenstein.workspace = true
futures-util.workspace = true
herder-adapters.workspace = true
herder-client-core.workspace = true
herder-protocol.workspace = true
herder-store.workspace = true
herder-tasktools.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
jiff.workspace = true
nix = { workspace = true, features = ["user"] }
portable-pty.workspace = true
pulldown-cmark.workspace = true
rcgen.workspace = true
regex.workspace = true
ring.workspace = true
rusqlite.workspace = true
rustls.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
slack-morphism.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "net", "process", "sync", "time"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tokio-util = { workspace = true, features = ["codec"] }
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
ureq.workspace = true
url.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true

[dev-dependencies]
# The integration tests sign people in with the software authenticator.
herder-daemon = { workspace = true, features = ["test-authenticator"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
