name: apple

# Builds and tests the iOS and macOS apps in apple/ on the client core's Swift bindings. Runs
# only when the apps or what they build on change.

on:
  pull_request:
    paths:
      - "apple/**"
      - "crates/herder-ffi/**"
      - "crates/herder-client-core/**"
      - "crates/herder-protocol/**"
      - "rust-toolchain.toml"
      - ".github/workflows/apple.yml"
  push:
    branches: [main]
    paths:
      - "apple/**"
      - "crates/herder-ffi/**"
      - "crates/herder-client-core/**"
      - "crates/herder-protocol/**"
      - "rust-toolchain.toml"
      - ".github/workflows/apple.yml"

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: debuginfo

jobs:
  apps:
    name: apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain and the Apple targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build the bindings, the xcframework and the fake daemon
        run: apple/scripts/build-ffi.sh
      - name: Test HerderKit against the fake daemon
        env:
          HERDER_FAKE_DAEMON: ${{ github.workspace }}/target/debug/examples/fake_daemon
        run: swift test --package-path apple/HerderKit
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec apple/project.yml
      - name: Build the iOS app (simulator and device)
        run: |
          for destination in "generic/platform=iOS Simulator" "generic/platform=iOS"; do
            xcodebuild build -quiet -project apple/herder.xcodeproj -scheme herder-iOS \
              -destination "$destination" CODE_SIGNING_ALLOWED=NO
          done
      - name: Build the macOS app
        run: >-
          xcodebuild build -quiet -project apple/herder.xcodeproj -scheme herder-macOS
          -destination "generic/platform=macOS" CODE_SIGNING_ALLOWED=NO
