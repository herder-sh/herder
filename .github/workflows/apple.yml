name: apple

# Builds and tests the iOS and macOS apps in apple/ on the client core's Swift bindings. Runs
# only when the apps or what they build on change. The bindings, xcframework and fake daemon
# build once and are cached by the Rust sources they come from and this workflow; a Linux job
# looks the cache up, so a change to the apps alone neither builds Rust nor waits for a macOS
# runner to find that out. The iOS and macOS jobs then run side by side on them. macOS runners
# are few and shared by every PR, so the builds that only ship (the iOS device build and the
# Release macOS app, uploaded as an artifact) run on main alone.

on:
  pull_request:
    paths:
      - "apple/**"
      - "crates/herder-ffi/**"
      - "crates/herder-client-core/**"
      - "crates/herder-protocol/**"
      - "rust-toolchain.toml"
      - ".github/workflows/apple.yml"
  push:
    branches: [main]
    paths:
      - "apple/**"
      - "crates/herder-ffi/**"
      - "crates/herder-client-core/**"
      - "crates/herder-protocol/**"
      - "rust-toolchain.toml"
      - ".github/workflows/apple.yml"

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: debuginfo

jobs:
  key:
    name: key
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
      hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: >-
          echo "key=apple-ffi-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**',
          'apple/scripts/build-ffi.sh', '.github/workflows/apple.yml') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            crates/herder-ffi/swift/build
            target/debug/examples/fake_daemon
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

  bindings:
    name: bindings
    needs: key
    if: needs.key.outputs.hit != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain and the Apple targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build the bindings, the xcframework and the fake daemon
        run: apple/scripts/build-ffi.sh
      - name: Run the Swift sample against the fake daemon
        timeout-minutes: 5
        run: swift run --package-path crates/herder-ffi/swift herder-sample "$PWD/target/debug/examples/fake_daemon"
      # Saved by its own step, not by actions/cache's post step: rust-cache's post step, which
      # runs first, cleans target/ of the fake daemon.
      - name: Save the bindings, the xcframework and the fake daemon
        uses: actions/cache/save@v6
        with:
          path: |
            crates/herder-ffi/swift/build
            target/debug/examples/fake_daemon
          key: ${{ needs.key.outputs.key }}

  # The measurements (apple/scripts/perf.sh) on the demo fleet under load and a machine with a
  # used journal: how the Mac app launches, opens a long session and scrolls, and how the iOS app
  # launches and resumes on a simulator. A hosted runner is a virtual machine, where XCTest
  # measures no frames, so what the table in the job summary tells there is when each launch
  # showed the Board, and the main thread's hangs; the scrolling budget holds on a Mac on a desk.
  perf:
    name: perf (${{ matrix.platform }})
    needs: [key, bindings]
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [mac, simulator]
    # Reports until every screen meets the scrolling budget (P19.1); then it gates.
    continue-on-error: true
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: |
            crates/herder-ffi/swift/build
            target/debug/examples/fake_daemon
          key: ${{ needs.key.outputs.key }}
          fail-on-cache-miss: true
      - name: Install the Metal toolchain (SwiftTerm's renderer needs it)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Measure the app
        timeout-minutes: 60
        env:
          HERDER_FAKE_DAEMON: ${{ github.workspace }}/target/debug/examples/fake_daemon
          PERF_TOLERANCE: "3"
        run: |
          brew install xcodegen
          export PERF_MAC_SETTINGS="CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO"
          status=0
          apple/scripts/perf.sh ${{ matrix.platform }} || status=$?
          [ ! -f target/perf/perf.md ] || cat target/perf/perf.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Print the failing tests
        if: failure()
        run: |
          for bundle in target/perf/*.xcresult; do
            [ -d "$bundle" ] || continue
            xcrun xcresulttool get test-results summary --path "$bundle" |
              jq -r '.testFailures[]? | "\(.testIdentifierString): \(.failureText)"'
          done
          # And where xcodebuild stopped, when it ran no test at all.
          tail -n 40 target/perf/*-test.log || true
      # The table, the tests' output and the app's log lines the table was read from.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-${{ matrix.platform }}
          path: |
            target/perf/perf.md
            target/perf/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: perf-${{ matrix.platform }}-xcresult
          path: target/perf/*.xcresult
          if-no-files-found: ignore
