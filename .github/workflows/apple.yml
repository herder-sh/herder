name: apple

# Builds and tests the iOS and macOS apps in apple/ on the client core's Swift bindings. Runs
# only when the apps or what they build on change. The bindings, xcframework and fake daemon
# build once and are cached by the Rust sources they come from and this workflow; a Linux job
# looks the cache up, so a change to the apps alone neither builds Rust nor waits for a macOS
# runner to find that out. The iOS and macOS jobs then run side by side on them. macOS runners
# are few and shared by every PR, so the builds that only ship (the iOS device build and the
# Release macOS app, uploaded as an artifact) run on main alone.

on:
  pull_request:
    paths:
      - "apple/**"
      - "crates/herder-ffi/**"
      - "crates/herder-client-core/**"
      - "crates/herder-protocol/**"
      - "rust-toolchain.toml"
      - ".github/workflows/apple.yml"
  push:
    branches: [main]
    paths:
      - "apple/**"
      - "crates/herder-ffi/**"
      - "crates/herder-client-core/**"
      - "crates/herder-protocol/**"
      - "rust-toolchain.toml"
      - ".github/workflows/apple.yml"

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: debuginfo

jobs:
  key:
    name: key
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
      hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: >-
          echo "key=apple-ffi-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**',
          'apple/scripts/build-ffi.sh', '.github/workflows/apple.yml') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            crates/herder-ffi/swift/build
            target/debug/examples/fake_daemon
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

  bindings:
    name: bindings
    needs: key
    if: needs.key.outputs.hit != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain and the Apple targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build the bindings, the xcframework and the fake daemon
        run: apple/scripts/build-ffi.sh
      - name: Run the Swift sample against the fake daemon
        timeout-minutes: 5
        run: swift run --package-path crates/herder-ffi/swift herder-sample "$PWD/target/debug/examples/fake_daemon"
      # Saved by its own step, not by actions/cache's post step: rust-cache's post step, which
      # runs first, cleans target/ of the fake daemon.
      - name: Save the bindings, the xcframework and the fake daemon
        uses: actions/cache/save@v6
        with:
          path: |
            crates/herder-ffi/swift/build
            target/debug/examples/fake_daemon
          key: ${{ needs.key.outputs.key }}

  ios:
    name: ios
    needs: [key, bindings]
    # Also when the bindings job is skipped on a cache hit.
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: |
            crates/herder-ffi/swift/build
            target/debug/examples/fake_daemon
          key: ${{ needs.key.outputs.key }}
          fail-on-cache-miss: true
      - name: Install the Metal toolchain (SwiftTerm's renderer needs it)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec apple/project.yml
      - name: Pick and boot a simulator
        run: |
          device=$(xcrun simctl list devices available -j |
            jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "device=$device" >> "$GITHUB_ENV"
          # Booted while the app builds, so the first test does not wait out a cold boot.
          xcrun simctl boot "$device"
          # The photo library loads on its first use, which can take longer than the photo test
          # waits: the picker then shows only "Loading...". Opening Photos loads it during the build.
          nohup sh -c "xcrun simctl bootstatus '$device' && xcrun simctl launch '$device' com.apple.mobileslideshow" \
            > "$RUNNER_TEMP/photos-warmup.log" 2>&1 &
      - name: Build the iOS app and its UI tests
        run: >-
          xcodebuild build-for-testing -quiet -skipPackagePluginValidation -project apple/herder.xcodeproj
          -scheme herder-iOS -destination "platform=iOS Simulator,id=$device" COMPILER_INDEX_STORE_ENABLE=NO
      - name: Test the iOS app on a simulator against the fake daemons
        # A UI test that loses its way can leave xcodebuild waiting forever.
        timeout-minutes: 20
        run: |
          xcrun simctl bootstatus "$device"
          # The photo test picks the newest photo, which the picker shows first. The simulator's own
          # photos can still be loading when it runs, and the picker then never hands one over;
          # this one is in the library, ready, once addmedia returns.
          xcrun simctl addmedia "$device" apple/App/Assets.xcassets/AppIcon.appiconset/icon-ios-1024.png
          # Two daemons, the link a device signed in to both shares and their owner's passkey, which
          # the app signs in with. They run until stdin closes, so keep it open for the job.
          (sleep 3600 | target/debug/examples/fake_daemon --share > "$RUNNER_TEMP/fake_daemon.out" &)
          # Nine lines: the link and the passkey first, the id of the session waiting on an
          # approval last.
          for _ in $(seq 60); do [ "$(wc -l < "$RUNNER_TEMP/fake_daemon.out")" -ge 9 ] && break; sleep 1; done
          [ "$(wc -l < "$RUNNER_TEMP/fake_daemon.out")" -ge 9 ] || { echo "the fake daemons did not start"; exit 1; }
          # And a vault that keeps secrets, for the secrets screen; the same person owns it.
          (sleep 3600 | target/debug/examples/fake_daemon --vault > "$RUNNER_TEMP/fake_vault.out" &)
          for _ in $(seq 60); do [ -s "$RUNNER_TEMP/fake_vault.out" ] && break; sleep 1; done
          [ -s "$RUNNER_TEMP/fake_vault.out" ] || { echo "the fake vault did not start"; exit 1; }
          # And a machine waiting for an owner, whose herder://own link the app approves.
          (sleep 3600 | target/debug/examples/fake_daemon --own > "$RUNNER_TEMP/fake_own.out" &)
          for _ in $(seq 60); do [ -s "$RUNNER_TEMP/fake_own.out" ] && break; sleep 1; done
          [ -s "$RUNNER_TEMP/fake_own.out" ] || { echo "the fake machine to own did not start"; exit 1; }
          # After a slow first boot the simulator can refuse to launch the test runner ("Unknown
          # application display identifier"), before any test runs. Nothing is spent by then, so
          # try again, a few times. Waiting does not clear it, but a reboot does.
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/ios-tests.xcresult"
            TEST_RUNNER_HERDER_PAIR_LINK=$(head -1 "$RUNNER_TEMP/fake_daemon.out") \
            TEST_RUNNER_HERDER_PASSKEY=$(sed -n 2p "$RUNNER_TEMP/fake_daemon.out") \
            TEST_RUNNER_HERDER_WAITING_SESSION=$(sed -n 9p "$RUNNER_TEMP/fake_daemon.out") \
            TEST_RUNNER_HERDER_VAULT_LINK=$(head -1 "$RUNNER_TEMP/fake_vault.out") \
            TEST_RUNNER_HERDER_OWN_LINK=$(head -1 "$RUNNER_TEMP/fake_own.out") \
              xcodebuild test-without-building -quiet -skipPackagePluginValidation -project apple/herder.xcodeproj -scheme herder-iOS \
              -destination "platform=iOS Simulator,id=$device" -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
              2>&1 | tee "$RUNNER_TEMP/ios-tests.log"
            status=${PIPESTATUS[0]}
            [ "$status" -eq 0 ] && exit 0
            grep -q "Failed to install or launch the test runner" "$RUNNER_TEMP/ios-tests.log" || exit "$status"
            echo "::warning::The simulator did not launch the test runner (attempt $attempt)"
            xcrun simctl shutdown "$device"
            xcrun simctl boot "$device"
            xcrun simctl bootstatus "$device"
          done
          exit 1
      # -quiet prints a failing UI test's name but not its assertion; the result bundle has both,
      # and the accessibility hierarchy at each failure.
      - name: Print the failing UI tests' assertions
        if: failure()
        run: |
          bundle="$RUNNER_TEMP/ios-tests.xcresult"
          [ -d "$bundle" ] || exit 0
          xcrun xcresulttool get test-results summary --path "$bundle" |
            jq -r '.testFailures[]? | "\(.testIdentifierString): \(.failureText)"'
          xcrun xcresulttool export attachments --path "$bundle" --output-path "$RUNNER_TEMP/attachments" || true
          for file in "$RUNNER_TEMP"/attachments/*.txt; do
            if [ -f "$file" ]; then echo "::group::$(basename "$file")"; cat "$file"; echo "::endgroup::"; fi
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-tests-xcresult
          path: ${{ runner.temp }}/ios-tests.xcresult
          if-no-files-found: ignore
      - name: Build the iOS app for devices
        if: github.event_name == 'push'
        run: >-
          xcodebuild build -quiet -skipPackagePluginValidation -project apple/herder.xcodeproj -scheme herder-iOS
          -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO

  # The Mac UI tests (apple/MacUITests) on the demo fleet: selecting and copying transcript text
  # with the mouse, which no log shows going wrong.
  mac-ui:
    name: mac-ui
    needs: [key, bindings]
    # Also when the bindings job is skipped on a cache hit.
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: |
            crates/herder-ffi/swift/build
            target/debug/examples/fake_daemon
          key: ${{ needs.key.outputs.key }}
          fail-on-cache-miss: true
      - name: Install the Metal toolchain (SwiftTerm's renderer needs it)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Test the macOS app against the demo fleet
        timeout-minutes: 30
        env:
          HERDER_FAKE_DAEMON: ${{ github.workspace }}/target/debug/examples/fake_daemon
        run: |
          brew install xcodegen
          apple/scripts/test-mac-ui.sh -quiet
      - name: Print the failing UI tests' assertions
        if: failure()
        run: |
          bundle=target/mac-ui-tests/tests.xcresult
          [ -d "$bundle" ] || exit 0
          xcrun xcresulttool get test-results summary --path "$bundle" |
            jq -r '.testFailures[]? | "\(.testIdentifierString): \(.failureText)"'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: mac-ui-tests-xcresult
          path: target/mac-ui-tests/tests.xcresult
          if-no-files-found: ignore

  macos:
    name: macos
    needs: [key, bindings]
    # Also when the bindings job is skipped on a cache hit.
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: |
            crates/herder-ffi/swift/build
            target/debug/examples/fake_daemon
          key: ${{ needs.key.outputs.key }}
          fail-on-cache-miss: true
      # build-mac-release.sh reads the version with cargo.
      - name: Install the toolchain
        if: github.event_name == 'push'
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the Metal toolchain (SwiftTerm's renderer needs it)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Test HerderKit against the fake daemon
        env:
          HERDER_FAKE_DAEMON: ${{ github.workspace }}/target/debug/examples/fake_daemon
        run: swift test --disable-index-store --package-path apple/HerderKit
      - name: Build, ad-hoc sign and zip the macOS app
        if: github.event_name == 'push'
        run: |
          brew install xcodegen
          apple/scripts/build-mac-release.sh
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: herder-app-macos-arm64
          path: dist/*
          if-no-files-found: error

  # The scroll gate: the Mac app's scroll measurements (apple/scripts/perf.sh) on the demo fleet
  # under load, which fail when a screen hitches past the budget. A hosted runner has no GPU and
  # renders slower than a Mac on a desk, hence the tolerance; the table is in the job summary.
  perf:
    name: perf
    needs: [key, bindings]
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v6
        with:
          path: |
            crates/herder-ffi/swift/build
            target/debug/examples/fake_daemon
          key: ${{ needs.key.outputs.key }}
          fail-on-cache-miss: true
      - name: Install the Metal toolchain (SwiftTerm's renderer needs it)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Measure scrolling on the macOS app
        timeout-minutes: 40
        env:
          HERDER_FAKE_DAEMON: ${{ github.workspace }}/target/debug/examples/fake_daemon
          PERF_TOLERANCE: "3"
        run: |
          brew install xcodegen
          export PERF_MAC_SETTINGS="CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO"
          status=0
          apple/scripts/perf.sh mac || status=$?
          cat target/perf/perf.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Print the failing tests
        if: failure()
        run: |
          bundle=target/perf/mac.xcresult
          [ -d "$bundle" ] || exit 0
          xcrun xcresulttool get test-results summary --path "$bundle" |
            jq -r '.testFailures[]? | "\(.testIdentifierString): \(.failureText)"'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: perf-xcresult
          path: target/perf/mac.xcresult
          if-no-files-found: ignore
