name: apple

# Builds and tests the iOS and macOS apps in apple/ on the client core's Swift bindings, and
# uploads the macOS app as an artifact. Runs only when the apps or what they build on change.
# The bindings, xcframework and fake daemon build once and are cached by the Rust sources they
# come from and this workflow, so a change to the apps alone skips the Rust build; the iOS and
# macOS jobs then run side by side on them.

on:
  pull_request:
    paths:
      - "apple/**"
      - "crates/herder-ffi/**"
      - "crates/herder-client-core/**"
      - "crates/herder-protocol/**"
      - "rust-toolchain.toml"
      - ".github/workflows/apple.yml"
  push:
    branches: [main]
    paths:
      - "apple/**"
      - "crates/herder-ffi/**"
      - "crates/herder-client-core/**"
      - "crates/herder-protocol/**"
      - "rust-toolchain.toml"
      - ".github/workflows/apple.yml"

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: debuginfo

jobs:
  bindings:
    name: bindings
    runs-on: macos-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: >-
          echo "key=apple-ffi-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'crates/**',
          'apple/scripts/build-ffi.sh', '.github/workflows/apple.yml') }}" >> "$GITHUB_OUTPUT"
      # Restored here and saved by its own step below, not by actions/cache's post step:
      # rust-cache's post step, which runs first, cleans target/ of the fake daemon.
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            crates/herder-ffi/swift/build
            target/debug/examples/fake_daemon
          key: ${{ steps.key.outputs.key }}
      - name: Install the toolchain and the Apple targets
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Build the bindings, the xcframework and the fake daemon
        if: steps.cache.outputs.cache-hit != 'true'
        run: apple/scripts/build-ffi.sh
      - name: Run the Swift sample against the fake daemon
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: swift run --package-path crates/herder-ffi/swift herder-sample "$PWD/target/debug/examples/fake_daemon"
      - name: Save the bindings, the xcframework and the fake daemon
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            crates/herder-ffi/swift/build
            target/debug/examples/fake_daemon
          key: ${{ steps.key.outputs.key }}

  ios:
    name: ios
    needs: bindings
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            crates/herder-ffi/swift/build
            target/debug/examples/fake_daemon
          key: ${{ needs.bindings.outputs.key }}
          fail-on-cache-miss: true
      - name: Install the Metal toolchain (SwiftTerm's renderer needs it)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec apple/project.yml
      - name: Test the iOS app on a simulator against the fake daemons
        # A UI test that loses its way can leave xcodebuild waiting forever.
        timeout-minutes: 30
        run: |
          # Two daemons and the link a device paired with both shares. They run until stdin
          # closes, so keep it open for the job.
          (sleep 3600 | target/debug/examples/fake_daemon --share > "$RUNNER_TEMP/fake_daemon.out" &)
          for _ in $(seq 60); do [ -s "$RUNNER_TEMP/fake_daemon.out" ] && break; sleep 1; done
          [ -s "$RUNNER_TEMP/fake_daemon.out" ] || { echo "the fake daemons did not start"; exit 1; }
          device=$(xcrun simctl list devices available -j |
            jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          TEST_RUNNER_HERDER_PAIR_LINK=$(head -1 "$RUNNER_TEMP/fake_daemon.out") \
            xcodebuild test -quiet -skipPackagePluginValidation -project apple/herder.xcodeproj -scheme herder-iOS \
            -destination "platform=iOS Simulator,id=$device" COMPILER_INDEX_STORE_ENABLE=NO
      - name: Build the iOS app for devices
        run: >-
          xcodebuild build -quiet -skipPackagePluginValidation -project apple/herder.xcodeproj -scheme herder-iOS
          -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO

  macos:
    name: macos
    needs: bindings
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            crates/herder-ffi/swift/build
            target/debug/examples/fake_daemon
          key: ${{ needs.bindings.outputs.key }}
          fail-on-cache-miss: true
      # build-mac-release.sh reads the version with cargo.
      - name: Install the toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install the Metal toolchain (SwiftTerm's renderer needs it)
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Test HerderKit against the fake daemon
        env:
          HERDER_FAKE_DAEMON: ${{ github.workspace }}/target/debug/examples/fake_daemon
        run: swift test --disable-index-store --package-path apple/HerderKit
      - name: Build, ad-hoc sign and zip the macOS app
        run: |
          brew install xcodegen
          apple/scripts/build-mac-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: herder-app-macos-arm64
          path: dist/*
          if-no-files-found: error
