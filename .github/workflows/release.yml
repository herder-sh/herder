name: release

# A `v*` tag builds static musl binaries and the macOS app, and publishes them as a GitHub
# Release; it also uploads the iOS app to TestFlight. workflow_dispatch runs the same, without
# publishing the GitHub Release. PRs that change this file or the app's release script run the
# builds only, without the TestFlight upload, which needs the App Store Connect secrets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml", "apple/scripts/build-mac-release.sh"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl and the toolchain from rust-toolchain.toml
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Read the version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "herder") | .version')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        # ring compiles C for the target; musl-gcc builds it against musl instead of glibc.
        env:
          TARGET_CC: musl-gcc
        run: cargo build --release --locked --target "$TARGET" -p herder
      - name: Check the binary is static and runs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bin="target/$TARGET/release/herder"
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
          test "$("$bin" --version)" = "herder $VERSION"
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="herder-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/herder" LICENSE README.md "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          rm -r "$name"
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: herder-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain and the Apple targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "herder") | .version')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version $version"
            exit 1
          fi
      - name: Install the Metal toolchain (SwiftTerm's renderer needs it) and XcodeGen
        run: |
          xcodebuild -downloadComponent MetalToolchain
          brew install xcodegen
      - name: Build the bindings and the xcframework
        run: apple/scripts/build-ffi.sh
      - name: Build, ad-hoc sign and zip the app
        run: apple/scripts/build-mac-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: herder-app-macos-arm64
          path: dist/*
          if-no-files-found: error

  testflight:
    name: upload iOS app to TestFlight
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain and the iOS target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Install the Metal toolchain (SwiftTerm's renderer needs it) and XcodeGen
        run: |
          xcodebuild -downloadComponent MetalToolchain
          brew install xcodegen
      - name: Build the bindings and the xcframework
        run: apple/scripts/build-ffi.sh aarch64-apple-ios
      - name: Archive and upload the iOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          # Grows with every run of this workflow, so each upload of a version has a new build.
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY" > "$ASC_KEY_PATH"
          apple/scripts/upload-testflight.sh

  publish:
    name: publish
    needs: [build, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: herder-*
          path: dist
          merge-multiple: true
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "herder ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            $prerelease
