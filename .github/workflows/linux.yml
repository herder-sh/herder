name: linux

# Builds and tests the GTK app in linux/. It is its own workspace so the required `ci` check
# needs no GTK packages; this runs only when the app or what it builds on changes.

on:
  pull_request:
    paths:
      - "linux/**"
      - "crates/herder-client-core/**"
      - "crates/herder-protocol/**"
      - "rust-toolchain.toml"
      - ".github/workflows/linux.yml"
  push:
    branches: [main]
    paths:
      - "linux/**"
      - "crates/herder-client-core/**"
      - "crates/herder-protocol/**"
      - "rust-toolchain.toml"
      - ".github/workflows/linux.yml"

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: linux

jobs:
  gtk:
    name: gtk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK, libadwaita and the toolchain from rust-toolchain.toml
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgtk-4-dev libadwaita-1-dev xvfb
          rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      # The window tests need a display.
      - run: xvfb-run -a cargo test --locked
