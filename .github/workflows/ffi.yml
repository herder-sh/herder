name: ffi

# Builds the Kotlin bindings of herder-client-core (crates/herder-ffi) and tests them against a
# fake daemon on the JVM, and uploads the AAR (arm64-v8a, x86_64) as an artifact. Runs only
# when the bindings or what they wrap change. The `apple` workflow builds the Swift bindings
# and runs their sample; the required `ci` check builds and tests herder-ffi's Rust side with
# the rest of the workspace.

on:
  pull_request:
    paths:
      - "crates/herder-ffi/**"
      - "crates/herder-client-core/**"
      - "crates/herder-protocol/**"
      - ".github/workflows/ffi.yml"
  push:
    branches: [main]
    paths:
      - "crates/herder-ffi/**"
      - "crates/herder-client-core/**"
      - "crates/herder-protocol/**"
      - ".github/workflows/ffi.yml"
  workflow_dispatch:

concurrency:
  group: ffi-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: debuginfo

jobs:
  kotlin:
    name: kotlin
    runs-on: ubuntu-latest
    env:
      KOTLIN: crates/herder-ffi/kotlin
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain and the Android targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build the host library, the bindings generator and the fake daemon
        run: cargo build -p herder-ffi --features bindgen --lib --bin uniffi-bindgen --example fake_daemon
      - name: Generate the Kotlin bindings
        run: >-
          target/debug/uniffi-bindgen generate --library target/debug/libherder_ffi.so
          --language kotlin --no-format --out-dir "$KOTLIN/build/generated/uniffi"
      - name: Build the Android libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t x86_64 -o "$KOTLIN/build/jniLibs" build -p herder-ffi --release
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test the bindings on the JVM and build the AAR
        run: gradle -p "$KOTLIN" --no-daemon :jvm:test :android:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: herder-android
          path: ${{ env.KOTLIN }}/android/build/outputs/aar/android-release.aar
          if-no-files-found: error
