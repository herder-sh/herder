name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      # The Linux app (linux/) builds on GTK 4 and libadwaita, and its window tests need a
      # display.
      - name: Install GTK, libadwaita and Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgtk-4-dev libadwaita-1-dev xvfb
      # The relay Worker (deploy/relay-worker) runs in a local workerd for its own tests and
      # the Rust end-to-end tests through it.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/relay-worker/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: deploy/relay-worker
      - run: npm test
        working-directory: deploy/relay-worker
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: xvfb-run -a cargo test --workspace
      - name: Lint install.sh
        run: shellcheck --shell=sh install.sh

  macos:
    # herder runs on Apple silicon Macs too: keep the binary building there, and run its unit
    # tests (binary replacement, the launchd service) on macOS itself.
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p herder -- -D warnings
      - run: cargo test --locked -p herder --bin herder
