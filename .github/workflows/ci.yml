name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      # The Linux app (linux/) builds on GTK 4 and libadwaita, and its window tests need a
      # display.
      - name: Install GTK, libadwaita and Xvfb
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libgtk-4-dev libadwaita-1-dev xvfb
      # Only main saves the cache; branches restore main's. Per-branch caches pushed the
      # repo past GitHub's 10 GB cache limit and evicted main's.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # nextest runs the test binaries in parallel; cargo test ran them one after another.
      # It skips doctests, so those run separately.
      - run: xvfb-run -a cargo nextest run --workspace
      - run: cargo test --workspace --doc
      - name: Lint install.sh
        run: shellcheck --shell=sh install.sh

  macos:
    # herder runs on Apple silicon Macs too: keep the binary building there, and run its unit
    # tests (binary replacement, the launchd service) on macOS itself.
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p herder -- -D warnings
      - run: cargo test --locked -p herder --bin herder
