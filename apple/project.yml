# The Xcode project for the iOS and macOS apps: `xcodegen generate` writes herder.xcodeproj.
# Both targets are a thin shell (App/) over HerderKit, which holds the app.
name: herder
options:
  bundleIdPrefix: sh.herder
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    PRODUCT_NAME: herder
    # Not `herder`: on a case-insensitive disk it clashes with the bindings module `Herder`.
    PRODUCT_MODULE_NAME: HerderApp
    PRODUCT_BUNDLE_IDENTIFIER: sh.herder.Herder
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: herder
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    INFOPLIST_KEY_NSMicrophoneUsageDescription: herder listens while you dictate a prompt.
packages:
  HerderKit:
    path: HerderKit
targets:
  herder-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["*.entitlements", "Info.plist"]
    dependencies:
      - package: HerderKit
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        # HerderFFI.xcframework has arm64 slices only.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        # The launch screen is the splash's background, so the splash follows it seamlessly.
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSCameraUsageDescription: herder scans the QR code that herder pair prints, to pair with a machine.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: >-
          herder connects to the machines you pair with, which may be on your local network.
        # As declared in App Store Connect: only standard, exempt encryption (TLS to the daemons),
        # so TestFlight builds do not wait on the export compliance question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    scheme:
      testTargets: [herder-iOS-UITests]
  herder-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: herder-iOS
    settings:
      base:
        PRODUCT_NAME: herder-iOS-UITests
        PRODUCT_MODULE_NAME: HerderUITests
        PRODUCT_BUNDLE_IDENTIFIER: sh.herder.Herder.UITests
        GENERATE_INFOPLIST_FILE: YES
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
  # The screenshots on herder.sh (the `screenshots` workflow), against `fake_daemon --demo`;
  # their own schemes, so the app's tests never run them.
  herder-iOS-Screenshots:
    type: bundle.ui-testing
    platform: iOS
    sources: [ScreenshotTests]
    dependencies:
      - target: herder-iOS
    settings:
      base:
        PRODUCT_NAME: herder-iOS-Screenshots
        PRODUCT_MODULE_NAME: HerderScreenshots
        PRODUCT_BUNDLE_IDENTIFIER: sh.herder.Herder.Screenshots
        GENERATE_INFOPLIST_FILE: YES
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    scheme:
      testTargets: [herder-iOS-Screenshots]
  herder-macOS-Screenshots:
    type: bundle.ui-testing
    platform: macOS
    sources: [ScreenshotTests]
    dependencies:
      - target: herder-macOS
    settings:
      base:
        PRODUCT_NAME: herder-macOS-Screenshots
        PRODUCT_MODULE_NAME: HerderScreenshots
        PRODUCT_BUNDLE_IDENTIFIER: sh.herder.Herder.Screenshots
        GENERATE_INFOPLIST_FILE: YES
        ARCHS: arm64
    scheme:
      testTargets: [herder-macOS-Screenshots]
  herder-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["*.entitlements", "Info.plist"]
    dependencies:
      - package: HerderKit
    settings:
      base:
        # HerderFFI.xcframework has arm64 slices only.
        ARCHS: arm64
        CODE_SIGN_ENTITLEMENTS: App/herder.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    scheme: {}
